name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # ✅ خلي الـ chmod يشير للمسار الصحيح
    - name: Make gradlew executable
      run: chmod +x locationmicroservice/gradlew

    # ✅ نفذ gradlew من داخل مجلد الـ microservice
    - name: Build with Gradle Wrapper
      run: cd locationmicroservice && ./gradlew build -x test

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # ✅ برضو هنا لازم تروحي على فولدر الـ microservice
    - name: Generate and submit dependency graph
      run: cd locationmicroservice && ../gradlew dependencies
